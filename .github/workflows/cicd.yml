name: Demo DevOps Dashboard CI/CD

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:

  build:

    name: Build Application

    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm ci

      - name: Build React App
        run: npm run build

  test:

    name: Run Tests

    needs: build

    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm ci

      - name: Run Tests
        run: npm test -- --watchAll=false

  docker:

    name: Docker Build & Push

    needs: test

    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker Image
        run: |
          docker build \
          --build-arg REACT_APP_BUILD_NUMBER=${{ github.run_number }} \
          --build-arg REACT_APP_DEPLOY_DATE="$(date -u '+%Y-%m-%d %H:%M UTC')" \
          -t ${{ secrets.DOCKER_USERNAME }}/demo-devops-dashboard:${{ github.run_number }} \
          -t ${{ secrets.DOCKER_USERNAME }}/demo-devops-dashboard:latest .

      - name: Push Docker Image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/demo-devops-dashboard:${{ github.run_number }}
          docker push ${{ secrets.DOCKER_USERNAME }}/demo-devops-dashboard:latest

  deploy-github-pages:

    name: Deploy to GitHub Pages

    needs: docker

    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm ci

      - name: Build Production Files
        run: npm run build

      - name: Deploy Website
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build

  deploy-kubernetes:

    name: Deploy Kubernetes Manifests

    needs: docker

    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Kubectl
        uses: azure/setup-kubectl@v4

      - name: Validate Kubernetes Files
        run: |
          kubectl version --client
          echo "Kubernetes deployment files validated"

      # Future deployment step
      # kubectl apply -f k8s/deployment.yaml
      # kubectl apply -f k8s/service.yaml
